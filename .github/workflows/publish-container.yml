name: Publish Container Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.mod

      - name: Install matching restic for repository integration tests
        run: |
          curl -fsSL https://github.com/restic/restic/releases/download/v0.14.0/restic_0.14.0_linux_amd64.bz2 -o /tmp/restic.bz2
          bunzip2 -c /tmp/restic.bz2 > /tmp/restic
          chmod +x /tmp/restic
          sudo mv /tmp/restic /usr/local/bin/restic

      - name: Backend tests
        working-directory: backend
        run: |
          URESTIC_TEST_RESTIC="$(command -v restic)" go test ./...
          go vet ./...

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Snapshot browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Refuse known injected payload
        run: |
          if grep -rnE "global\.o=|_\\\$_f213|5-2-301-du" --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.ts' --include='*.vue' --include='*.go' --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::error::known injected payload signature found"; exit 1
          fi

  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/urestic
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
